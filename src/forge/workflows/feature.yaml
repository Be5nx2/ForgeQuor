name: feature
description: The Griller talks the subject through with the human until they confirm its summary, the Spec Writer writes the spec and the human approves it, the Architect writes the Implementation Plan, the Developer builds it, the Checks run, a Reviewer reviews the change (duo by default), the pull request opens, then the human approves or rejects at the final Gate.
inputs: [task, review]
# The review mode the Run form preselects.
review: duo
steps:
  - id: griller
    type: conversation
    agent: griller
  - id: spec-writer
    type: agent
    agent: spec-writer
    needs: [griller]
  - id: spec
    type: gate
    gate: spec
    needs: [spec-writer]
    # A rejection with Feedback starts a new Iteration in which the Spec Writer redoes the spec; the human decides when to stop.
    on_reject: spec-writer
  # The Architect reads the spec and the code and writes the Implementation Plan (and any ADR); no Gate follows it.
  - id: architect
    type: agent
    agent: architect
    needs: [spec]
  # Art, only when the grilling ordered Assets: the Artist draws them, the human judges them, then the Developer builds on them.
  - id: artist
    type: artist
    needs: [architect]
    when: assets
  - id: asset-gate
    type: gate
    gate: asset
    needs: [artist]
    when: assets
    # Rejected Assets go back to the Artist with their Feedback in a new Iteration.
    on_reject: artist
  - id: developer
    type: agent
    agent: developer
    needs: [asset-gate]
  - id: checks
    type: checks
    needs: [developer]
    # A failing Check sends the work back to the Developer: 1 try + 2 more, then an Escalation.
    on_reject: developer
    max_attempts: 3
  - id: review
    type: review
    needs: [checks]
    # Changes requested go back to the Developer, with the Review: 1 try + 2 more, then an Escalation.
    on_reject: developer
    max_attempts: 3
  - id: publish
    type: publish
    needs: [review]
  - id: final
    type: gate
    gate: final
    needs: [publish]
    # A rejection with Feedback starts a new Iteration; the human decides when to stop.
    on_reject: developer
