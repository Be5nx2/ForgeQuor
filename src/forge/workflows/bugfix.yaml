name: bugfix
description: The Developer reproduces the bug with a failing test and fixes it, the Checks run, a Reviewer reviews the change (solo by default), the pull request opens, then the human approves or rejects at the final Gate.
inputs: [task, review]
# The review mode the Run form preselects.
review: solo
steps:
  - id: developer
    type: agent
    agent: bugfixer
  - id: checks
    type: checks
    needs: [developer]
    # A failing Check sends the work back to the Developer: 1 try + 2 more, then an Escalation.
    on_reject: developer
    max_attempts: 3
  - id: review
    type: review
    needs: [checks]
    # Changes requested go back to the Developer, with the Review: 1 try + 2 more, then an Escalation.
    on_reject: developer
    max_attempts: 3
  - id: publish
    type: publish
    needs: [review]
  - id: final
    type: gate
    gate: final
    needs: [publish]
    # A rejection with Feedback starts a new Iteration; the human decides when to stop.
    on_reject: developer
