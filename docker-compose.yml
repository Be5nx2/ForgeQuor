# A fixed name, so every checkout or Run worktree reuses the one PostgreSQL instead of starting a second one on the same port.
name: forgequor

services:
  postgres:
    image: postgres:17
    # Every checkout, every Run's worktree and every test run share this one instance: a full test run alone opens ~40
    # connections, so the default 100 ran out as soon as two suites ran side by side ("too many clients already").
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: forgequor
      POSTGRES_PASSWORD: forgequor
      POSTGRES_DB: forgequor
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgequor"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
