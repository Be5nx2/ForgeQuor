services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: forgequor
      POSTGRES_PASSWORD: forgequor
      POSTGRES_DB: forgequor
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgequor"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
